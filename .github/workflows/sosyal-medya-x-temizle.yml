name: X hesabındaki tüm paylaşımları sil (elle, geri alınamaz)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Onaylamak için birebir "SIL" yaz — geri alınamaz'
        required: true
jobs:
  temizle:
    if: inputs.confirm == 'SIL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install tweepy
      - name: Tüm paylaşımları sil
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python3 scripts/social/delete_all_x_posts.py
