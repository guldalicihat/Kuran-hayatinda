<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background:
      radial-gradient(circle at 18% 10%, rgba(240,185,78,0.10), transparent 42%),
      radial-gradient(circle at 85% 92%, rgba(240,185,78,0.08), transparent 45%),
      linear-gradient(160deg, #1a1410 0%, #241c15 45%, #17120d 100%);
    width:1080px; height:1920px;
    position:relative;
    overflow:hidden;
  }
  .frame { position:absolute; top:56px; left:56px; right:56px; bottom:56px; border:1.5px solid rgba(240,185,78,0.55); }
  .corner { position:absolute; width:38px; height:38px; border-color:#f0b94e; }
  .corner.tl { top:-1.5px; left:-1.5px; border-top:3px solid #f0b94e; border-left:3px solid #f0b94e; }
  .corner.br { bottom:-1.5px; right:-1.5px; border-bottom:3px solid #f0b94e; border-right:3px solid #f0b94e; }

  .brand { position:absolute; top:140px; left:0; right:0; text-align:center; }
  .crescent { width:44px; height:44px; margin-bottom:16px; }
  .wordmark { color:#e8c877; font-size:28px; letter-spacing:8px; font-weight:700; text-transform:uppercase; }
  .tagline { margin-top:12px; color:rgba(232,200,119,0.65); font-size:18px; letter-spacing:4px; font-style:italic; text-transform:uppercase; }

  .hook { position:absolute; top:0; left:130px; right:130px; bottom:0; display:flex; align-items:center; justify-content:center; text-align:center; }
  .hook p { color:#f4ecdd; font-size:62px; line-height:1.5; font-weight:400; }

  .footer { position:absolute; bottom:170px; left:0; right:0; text-align:center; }
  .hr { width:90px; height:1px; background:rgba(240,185,78,0.5); margin:0 auto 34px; }
  .cta { display:inline-block; background:linear-gradient(135deg,#f0b94e,#d99a2b); color:#1a1410; font-size:22px; font-weight:700; letter-spacing:3px; padding:18px 44px; border-radius:999px; }
</style>
</head>
<body>
  <div class="frame"><div class="corner tl"></div><div class="corner br"></div></div>
  <div class="brand">
    <svg class="crescent" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="33" fill="none" stroke="#e8c877" stroke-width="3"/>
      <path d="M50 10v9M50 81v9M10 50h9M81 50h9" stroke="#e8c877" stroke-width="3" stroke-linecap="round"/>
      <path d="M50 20 L59 50 L50 50 Z" fill="#f4ecdd"/>
      <path d="M50 20 L41 50 L50 50 Z" fill="#e8c877"/>
      <path d="M50 80 L59 50 L50 50 Z" fill="#8a6a2a"/>
      <path d="M50 80 L41 50 L50 50 Z" fill="#5c4318"/>
      <circle cx="50" cy="50" r="4" fill="#f4ecdd" stroke="#5c4318" stroke-width="1"/>
    </svg>
    <div class="wordmark">Kur'an Hayatında</div>
    <div class="tagline">Huzurun Doğru Yolu</div>
  </div>
  <div class="hook"><p>{{SORU_HTML}}</p></div>
  <div class="footer">
    <div class="hr"></div>
    <div class="cta">CEVAP AÇIKLAMADA</div>
  </div>
</body>
</html>
